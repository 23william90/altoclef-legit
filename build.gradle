plugins {
    id 'fabric-loom' version '1.7.3'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "JitPack"
        url = "https://jitpack.io"
    }
    maven {
        name = "MiranCZRepo"
        url = "https://mirancz.github.io/maven/"
        artifactUrls("https://mirancz.github.io/maven/cabaletta/baritone-unoptimized/1.21.1")
    }
    maven {
        name = 'babbaj-repo'
        url = 'https://babbaj.github.io/maven/'
    }
    flatDir {
        dirs 'baritone-26.3/dist', 'baritone-26.3/fabric/build/libs', 'libs'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.minecraft_version}+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:0.3.5")))
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.115.0+${project.minecraft_version}"

    implementation 'com.fasterxml.jackson.core:jackson-core:2.16.0'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.16.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.0'
    shadow 'com.fasterxml.jackson.core:jackson-core:2.16.0'
    shadow 'com.fasterxml.jackson.core:jackson-annotations:2.16.0'
    shadow 'com.fasterxml.jackson.core:jackson-databind:2.16.0'

    implementation 'dev.babbaj:nether-pathfinder:1.6'
    shadow 'dev.babbaj:nether-pathfinder:1.6'

    // Baritone 26.3 dependency from our modernized fork:
    // https://github.com/23william90/baritone-26.3
    modImplementation "baritone:baritone-fabric:${project.minecraft_version}-SNAPSHOT"
    include "baritone:baritone-fabric:${project.minecraft_version}-SNAPSHOT"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
}

shadowJar {
    configurations = [project.configurations.shadow]
}

remapJar {
    dependsOn shadowJar
    inputFile.set(shadowJar.archiveFile)
}
